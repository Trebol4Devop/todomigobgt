version: "3.8"

services:
  todomigobgt-notifications:
    # Si se define DOCKER_IMAGE en .env (ej. miusuario/todomigobgt-service:latest), la descargará de Docker Hub.
    # Si no se define, se compilará localmente con el Dockerfile.
    image: ${DOCKER_IMAGE:-todomigobgt-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todomigobgt-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/app/data/todomigobgt.db
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=${SMTP_USER:-todomigobgt.notificaciones@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-lykc jsej osgf ezee}
      - SMTP_APP_NAME=todomigobgt
      - SENDER_NAME=TODOMIGOBGT Alertas Ciudadanas
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
