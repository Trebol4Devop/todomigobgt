<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncio - TODOMIGOBGT</title>
</head>
<body style="margin: 0; padding: 20px; background-color: #f3f4f6; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: Arial, sans-serif;">
                    
                    <!-- Borde superior: Bandera de Guatemala (Azul - Blanco - Azul) -->
                    <tr>
                        <td>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="height: 8px;">
                                <tr>
                                    <td width="33.3%" style="background-color: #4997D0;"></td>
                                    <td width="33.3%" style="background-color: #FFFFFF;"></td>
                                    <td width="33.3%" style="background-color: #4997D0;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Encabezado -->
                    <tr>
                        <td style="padding: 20px 30px; border-bottom: 1px solid #e5e7eb;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <!-- Centrado ya que se quitó el icono de modo oscuro -->
                                    <td style="text-align: center;">
                                        <h1 style="margin: 0; font-size: 22px; color: #111827; font-family: 'Comic Sans MS', 'Marker Felt', sans-serif;">TODOMIGOBGT</h1>
                                        <p style="margin: 4px 0 0 0; font-size: 11px; color: #6b7280; font-family: Arial, sans-serif;">Este es un sitio oficial del gobierno</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Cuerpo / Anuncio sin borde y sin icono -->
                    <tr>
                        <td style="padding: 50px 40px; text-align: center;">
                            
                            <!-- Título y Texto -->
                            <h2 style="margin: 0 0 15px 0; font-size: 24px; color: #1f2937;">¡Nuevo Anuncio!</h2>
                            
                            <p style="margin: 0 auto 30px auto; font-size: 16px; color: #4b5563; line-height: 1.6; max-width: 85%;">
                                Tienes una nueva notificación en el portal. Haz clic en el botón de abajo para revisar los detalles del trámite.
                            </p>
                            
                            <!-- Botón -->
                            <a href="#" style="display: inline-block; padding: 14px 32px; background-color: #4997D0; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; box-shadow: 0 2px 4px rgba(73, 151, 208, 0.3);">Ver Notificación</a>
                            
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
